name: Feature request
description: Suggest something the module should be able to do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What are you or your organisation unable to do today? Describe the
        situation rather than the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you have tried or considered instead

  - type: checkboxes
    id: scope
    attributes:
      label: Where does this belong
      description: >-
        Some things belong upstream. Vocdoni protocol and SaaS API features go to
        the Vocdoni repositories; participation features that are not about
        voting usually go to Decidim itself.
      options:
        - label: I believe this belongs in this module rather than in Decidim or Vocdoni.
          required: true
